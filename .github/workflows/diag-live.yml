name: diag-live
on:
  push:
    branches: [claude/admiring-bell-y8nc3v]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/diag-live.mjs https://appofapp-gh.vercel.app/
      - run: node tools/diag-live.mjs https://anat1969.github.io/AppOfApp-GH/
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: 'diag-*.png' }
